on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read

jobs:
  build:
    environment: "slippi-nix.cachix.org"
    name: build and cache
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@6004951b182f8860210c8d6f0d808ec5b1a33d28
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@18cf96c7c98e048e10a83abd92116114cd8504be
        with:
          name: slippi-nix
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: nix build .#slippi-launcher .#slippi-launcher-desktop .#slippi-netplay .#slippi-netplay-beta .#slippi-playback --accept-flake-config
